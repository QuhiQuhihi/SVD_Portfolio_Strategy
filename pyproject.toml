[project]
name = "svd-portfolio-research"
version = "0.1.0"
description = "Walk-forward evaluation of SVD covariance models for ETF portfolio risk"
requires-python = ">=3.12,<3.15"
dependencies = [
  "numpy>=2.2,<3",
  "pandas>=2.2,<3",
  "scipy>=1.15,<2",
  "scikit-learn>=1.6,<2",
  "matplotlib>=3.10,<4",
  "yfinance>=0.2.65,<2",
  "exchange-calendars>=4.11,<5",
  "nbformat>=5.10,<6",
  "nbclient>=0.10,<1",
  "nbconvert>=7.16,<8",
  "ipykernel>=6.29,<8",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/svd_portfolio"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Notebook narrative strings keep their intended paragraph wrapping.
"scripts/build_notebooks.py" = ["E501"]
